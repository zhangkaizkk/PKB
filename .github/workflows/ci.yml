name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install lint + test tools
        run: pip install ruff pytest pytest-asyncio

      - name: Ruff lint
        run: ruff check app/

      - name: Ruff format
        run: ruff format app/ --check

      - name: pytest (纯函数单测，无需 DB/网络)
        run: python -m pytest tests/ -v
