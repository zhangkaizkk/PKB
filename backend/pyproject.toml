[project]
name = "pkb-backend"
version = "0.0.8"
description = "PKB Personal Knowledge Base - Backend"
requires-python = ">=3.11"
dependencies = [
    # --- 第一阶段依赖 ---
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pymysql>=1.1",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.0",
    "python-multipart>=0.0.9",
    "pypdf>=4.1",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-pptx>=0.6",
    "python-ulid>=2.3",
    # --- OCR + RAG 新依赖 ---
    "paddlepaddle>=3.0.0",
    "paddleocr>=3.4.0",
    "PyMuPDF>=1.24.0",
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "chromadb>=0.5.0",
    "httpx>=0.27.0",
    "tenacity>=8.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
