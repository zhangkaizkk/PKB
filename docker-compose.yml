services:
  mysql:
    image: mysql:8.0
    container_name: pkb-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: UTC
    volumes:
      - mysql_data:/var/lib/mysql
      - ./deploy/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: pkb-backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}?charset=utf8mb4
      SECRET_KEY: ${SECRET_KEY}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      DATA_DIR: /app/data/files
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}

      # OCR
      OCR_ENABLED: ${OCR_ENABLED}
      OCR_LANG: ${OCR_LANG}
      OCR_USE_GPU: ${OCR_USE_GPU}

      # RAG
      CHROMA_PERSIST_DIR: /app/data/chroma
      RAG_CHUNK_SIZE: ${RAG_CHUNK_SIZE}
      RAG_CHUNK_OVERLAP: ${RAG_CHUNK_OVERLAP}
      RAG_TOP_K_RETRIEVE: ${RAG_TOP_K_RETRIEVE}
      RAG_TOP_K_RERANK: ${RAG_TOP_K_RERANK}
      RAG_LOCAL_ONLY: ${RAG_LOCAL_ONLY}

      # Chat API（OpenAI 兼容）
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_CHAT_MODEL: ${LLM_CHAT_MODEL}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES}

      # Embedding API（OpenAI 兼容）
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      EMBEDDING_DIM: ${EMBEDDING_DIM}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE}
      EMBEDDING_TIMEOUT_SECONDS: ${EMBEDDING_TIMEOUT_SECONDS}
      EMBEDDING_MAX_RETRIES: ${EMBEDDING_MAX_RETRIES}

      # 重排
      RERANK_MODE: ${RERANK_MODE}
      RERANK_CLOUD_BASE_URL: ${RERANK_CLOUD_BASE_URL}
      RERANK_CLOUD_API_KEY: ${RERANK_CLOUD_API_KEY}
      RERANK_CLOUD_MODEL: ${RERANK_CLOUD_MODEL}
    volumes:
      - ./data/files:/app/data/files
      - ./data/chroma:/app/data/chroma
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build: ./frontend
    container_name: pkb-frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  mysql_data:
